version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command:
      >
      sh -c "
        alembic -c /app/app/alembic.ini upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  celery_worker:
    build: .
    command: celery -A app.parser.tasks worker -l info
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  celery_beat:
    build: .
    command: celery -A app.parser.tasks beat -l info
    env_file: .env
    depends_on:
      - redis
    volumes:
      - .:/app

volumes:
  pgdata:
